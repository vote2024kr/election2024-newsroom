function mapSVG(prov='',interactive=true,city='',selected=''){if(!geo)return `<img src="${prov?outline:mapimage}" alt="${prov?'지도 경계 연결 대기':'실제 최종 개표 지도 캡처'}"><p class="muted">${prov?'시·도 확대 지도 경계를 연결하는 중입니다.':'지도 원본을 연결 중입니다. 시·도 버튼으로도 지역을 선택할 수 있습니다.'}</p>`;
 const feats=geo.features.filter(f=>!prov||f.properties.region===short[prov]);if(!feats.length)return '<p>지도 경계 미확인</p>';const coords=feats.flatMap(f=>rings(f).flatMap(r=>r));const xx=coords.map(p=>p[0]*.8),yy=coords.map(p=>p[1]);const minx=Math.min(...xx),maxx=Math.max(...xx),miny=Math.min(...yy),maxy=Math.max(...yy);const W=740,H=700,k=Math.min(690/(maxx-minx),650/(maxy-miny)),ox=(W-(maxx-minx)*k)/2,oy=(H-(maxy-miny)*k)/2;const point=p=>[(ox+(p[0]*.8-minx)*k).toFixed(1),(H-oy-(p[1]-miny)*k).toFixed(1)];
 const parts=feats.map(f=>{const rec=byid[f.properties.id];if(!rec)return '';const parts=rings(f).map(r=>r.length<3?'':'M'+r.map(p=>point(p).join(',')).join(' L')+' Z').join(' ');let fade=city&&!citynames(rec.district).includes(city)?'.15':1;let stroke=selected===rec.id?'#ffe567':'#0c2038';const target=interactive?`data-act="${prov?'district':'region'}" data-value="${prov?rec.id:rec.region}"`:'',tip=esc(rec.region+' '+rec.district+' · '+rec.winner.name+' ('+rec.winner.party+')');return `<path ${target} d="${parts}" fill="${colors[rec.winner.party]||'#768da6'}" fill-opacity="${fade}" stroke="${stroke}" stroke-width="${selected===rec.id?3:0.8}"><title>${tip}</title></path>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="지역구 지리 경계 지도">${parts}</svg>`;}
function seatDonut(dict,total){const entries=Object.entries(dict).filter(([p,n])=>n>0).sort((a,b)=>b[1]-a[1]);let p=0;const circ=2*Math.PI*55;const circles=entries.map(([name,n])=>{const len=circ*n/total,out=`<circle cx="85" cy="85" r="55" fill="none" stroke-width="23" stroke="${colors[name]||'#7d93a4'}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-p}" transform="rotate(-90 85 85)"><title>${esc(name)} ${n}석</title></circle>`;p+=len;return out}).join('');return `<svg viewBox="0 0 170 170" aria-label="${total}석 도넛"><circle cx="85" cy="85" r="55" fill="none" stroke="#365571" stroke-width="23"/>${circles}<text x="85" y="82" text-anchor="middle" fill="white" font-size="26" font-weight="900">${total}</text><text x="85" y="103" text-anchor="middle" fill="#b5d5e6" font-size="12">의석</text></svg>`;}

function finalView(){const allParties=[...new Set([...Object.keys(data.regional),...Object.keys(data.pr)])].sort((a,b)=>(data.regional[b]||0)+(data.pr[b]||0)-(data.regional[a]||0)-(data.pr[a]||0));return `<div class="kicker">2024 · FINAL RESULTS</div><h1 class="h1">전국 확정 개표</h1><p class="muted">254개 지역구와 비례대표 46석의 개표가 완료된 최종 결과입니다.</p><div class="row-mini"><span class="badge">● 2024.04.11 10:25 · 개표 완료</span><strong class="headline">300석</strong><span>전국 실제 최종 투표율 ${data.national.toFixed(1)}%</span></div><div class="grid2"><section class="card map-panel"><h3>전국 지역구 당선 정당 지도 (254석)</h3>${mapSVG('',false)}<p class="muted">전국 최종 결과를 요약합니다. 자세한 지역구 탐색은 다른 메뉴에서 제공합니다.</p></section><div class="seat"><div class="stats"><section class="card"><h3>지역구 254석</h3><div class="donut-wrap">${seatDonut(data.regional,254)}<div>${legend(data.regional)}</div></div></section><section class="card"><h3>비례대표 46석</h3><div class="donut-wrap">${seatDonut(data.pr,46)}<div>${legend(data.pr)}</div></div></section></div><section class="card"><h3>국회 전체 300석</h3>${seatSemi()}</section></div></div><section class="card" style="margin-top:15px"><h3>정당별 최종 의석수 · 원래 정당명 기준</h3><p class="muted">지역구 당선 정당과 비례대표 명부 정당을 임의로 합산하지 않습니다.</p><table><thead><tr><th>정당</th><th>지역구</th><th>비례대표</th><th>합계</th></tr></thead><tbody>${allParties.map(p=>`<tr><td><i class="sw" style="background:${colors[p]||'#9aa'}"></i>${esc(p)}</td><td>${data.regional[p]||0}석</td><td>${data.pr[p]||0}석</td><td>${(data.regional[p]||0)+(data.pr[p]||0)}석</td></tr>`).join('')}<tr><th>전체</th><th>254석</th><th>46석</th><th>300석</th></tr></tbody></table></section><div class="bottom">지역별 상세 데이터가 필요하면 <button class="tab" data-page="district">지역·선거구 탐색으로 이동</button></div>`}
function districtView(){const provs=Object.keys(short),areaDs=all.filter(d=>d.region===state.region),cityMap={};for(const rec of areaDs)for(const name of citynames(rec.district))(cityMap[name]??=[]).push(rec);if(!cityMap[state.area])state.area='';const candidateRows=areaDs.filter(d=>(!state.area||citynames(d.district).includes(state.area))&&(!state.query||d.district.includes(state.query)||d.winner.name.includes(state.query)));const rec=byid[state.id]&&byid[state.id].region===state.region&&(!state.area||citynames(byid[state.id].district).includes(state.area))?byid[state.id]:null;const rate=data.rates[short[state.region]];
 let detail;if(rec){const turn=rec.ballots/rec.registered*100;detail=`<span class="badge">✓ 최종 당선 · 개표 완료</span><h3 style="margin-top:13px">${esc(rec.region)} ${esc(rec.district)}</h3><p><strong style="font-size:24px;color:${colors[rec.winner.party]||'#fff'}">${esc(rec.winner.name)}</strong> · ${esc(rec.winner.party)}</p><p>당선인 득표율 <strong style="font-size:26px">${rec.winner.share.toFixed(2)}%</strong></p><div class="turnout"><small>해당 지역구 투표율 · 원자료 계산</small><br><strong>${turn.toFixed(2)}%</strong><div class="track"><i style="width:${turn.toFixed(2)}%"></i></div><small>투표수 ${rec.ballots.toLocaleString()}표 ÷ 선거인수 ${rec.registered.toLocaleString()}명 × 100</small></div><h3>후보별 득표 비교</h3>${[...rec.candidates].sort((a,b)=>b.votes-a.votes).map(c=>`<div class="candidate"><div><span>${esc(c.name)} · ${esc(c.party)}</span><b>${c.votes.toLocaleString()}표 (${c.share.toFixed(2)}%)</b></div><div class="track"><i style="background:${colors[c.party]||'#9bb0bb'};width:${c.share}%"></i></div></div>`).join('')}<div class="bottom"><strong>1·2위 득표차 ${rec.margin.toLocaleString()}표</strong><p class="muted">유효 ${rec.valid.toLocaleString()}표 · 무효 ${rec.invalid.toLocaleString()}표</p></div><p class="muted">선관위 제22대 총선 지역구 개표자료 · 시트 ${rec.excel_row}행 · 지역구 ID ${rec.id}</p>`}
 else detail=state.region?`<h3>${esc(state.area||state.region)} 최종 개표</h3><p class="muted">왼쪽 지도를 선택하거나 가운데 목록에서 지역구를 선택하세요.</p>${rate!==undefined?`<div class="turnout"><small>${esc(short[state.region])} 시·도 최종 실제 투표율 · 선관위 발표</small><br><strong>${rate.toFixed(1)}%</strong></div>`:''}<p class="muted">시·군별 투표율은 별도 공식 자료 없이 추정하지 않습니다.</p>`:`<h3>지역구별 상세 탐색</h3><p class="muted">전국 지도에서 시·도를 선택하면 시·군 목록과 후보별 실제 개표 결과가 표시됩니다.</p>`;
 return `<div class="kicker">2024 · DISTRICT EXPLORER</div><h1 class="h1">지역·선거구 탐색</h1><p class="muted">전국 → 시·도 → 시·군 → 지역구 순서로 선택해 후보별 최종 개표 결과와 투표율을 확인합니다.</p><div class="row-mini">전국 ${state.region?'› '+esc(state.region):''} ${state.area?'› '+esc(state.area):''} ${rec?'› '+esc(rec.district):''}</div>${state.region?`<div class="explorer-actions" role="navigation" aria-label="지역 탐색 이동"><button type="button" data-act="back">← 이전 단계로</button><button type="button" data-act="national">⌂ 전국 지도 보기</button></div>`:''}
 <div class="grid4"><aside class="card national-card"><h3>전국 17개 시·도 선택</h3><p class="muted">전국 지도에서 지역을 선택하면 가운데 지도가 변경됩니다.</p><div class="map-panel national-map">${mapSVG('',true)}</div></aside>
 <div class="card selected-card"><h3>${state.region?'선택 지역 지도 · '+esc(state.region):'선택 지역 지도'}</h3><p class="muted">${state.region?esc(short[state.region])+' '+areaDs.length+'개 지역구 · 당선 정당별 색상 지도':'아래 시·도 목록에서 선택하세요.'}</p><div class="map-panel">${state.region?mapSVG(state.region,true,state.area,rec?.id||''):'<p class="muted">시·도를 선택하면 지역구 지도가 나타납니다.</p>'}</div></div>
 <div class="card detail">${detail}</div></div>
 <div class="grid-bottom"><section class="card"><h3>시·도 선택</h3><div class="region-buttons">${provs.map(r=>`<button data-region="${esc(r)}" class="${state.region===r?'active':''}">${esc(short[r])}</button>`).join('')}</div>${state.region?`<div class="bottom">${esc(short[state.region])} 지역구 ${areaDs.length}석<br>시·도 최종 투표율 <strong>${rate?.toFixed(1)}%</strong></div>`:''}</section>
 <section class="card"><h3>시·군 / 지역구 목록 · 선택 및 검색</h3>${state.region?`<p class="muted">선거구 이름에서 추출한 시·군별 탐색 목록입니다.</p><div class="cities"><button data-area="" class="${!state.area?'active':''}">전체 ${areaDs.length}</button>${Object.keys(cityMap).sort().map(name=>`<button data-area="${esc(name)}" class="${state.area===name?'active':''}">${esc(name)} (${cityMap[name].length})</button>`).join('')}</div><p><input id="district-search" placeholder="지역구·당선인 검색" value="${esc(state.query)}"></p><div class="list">${candidateRows.map(x=>`<button data-id="${esc(x.id)}" class="${rec?.id===x.id?'active':''}"><span>${esc(x.district)}</span><small>${esc(x.winner.party)}</small></button>`).join('')}</div>`:'<p class="muted">시·도를 선택하면 이곳에 시·군과 지역구 목록이 나타납니다.</p>'}</section></div>
 <div class="bottom muted">제22대 총선 확정 개표 원자료에 포함된 선거인수와 투표수로 지역구 투표율을 계산했습니다. 시·도 투표율은 별도 선관위 최종 발표값이며, 시·군 분류는 선거구 이름에 기반한 탐색용 목록입니다.</div>`}

const mediaItems=JSON.parse(document.getElementById('v5-media-data').textContent);
function mediaView(){return `<div class="kicker">2024 · DATA GRAPHICS</div><h1 class="h1">사진·영상 자료</h1><p class="muted">2024년 실제 확정 개표 및 당시 투표율로 새로 제작한 데이터 CG 6종입니다. 이전 버전 화면과 기존 교육용 예시 이미지는 제외했습니다. 동영상은 등록되어 있지 않습니다.</p><div class="media-review-grid">${mediaItems.map(item=>`<figure><img src="${item.src}" alt="${esc(item.title)}" loading="lazy"><figcaption>${esc(item.title)}</figcaption></figure>`).join('')}</div><p class="muted">이 자료는 웹사이트 화면 전체 캡처나 방송사의 공식 CG가 아닙니다. 구체적인 선거구 개표값과 투표율의 출처는 원본 자료를 참조하세요.</p>`}
function render(){document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===state.page));document.getElementById('screen').innerHTML=state.page==='final'?finalView():state.page==='media'?mediaView():districtView();}
document.addEventListener('click',ev=>{let t=ev.target.closest('[data-page],[data-region],[data-area],[data-id],[data-act]');if(!t)return;let action=t.dataset.act;
 if(action==='back'){if(state.id){state.id='';}else if(state.area){state.area='';}else if(state.region){state.region='';}state.query='';render();}
 else if(action==='national'){state.page='district';state.region='';state.area='';state.id='';state.query='';render();}
 else if(t.dataset.page){state.page=t.dataset.page;render();}
 else if(t.dataset.region||action==='region'){state.page='district';state.region=t.dataset.region||t.dataset.value;state.area='';state.id='';state.query='';render();}
 else if(t.hasAttribute('data-area')){state.area=t.dataset.area;state.id='';state.query='';render();}
 else if(t.dataset.id||action==='district'){state.id=t.dataset.id||t.dataset.value;state.area=state.area&&citynames(byid[state.id].district).includes(state.area)?state.area:'';render();}
});document.addEventListener('input',ev=>{if(ev.target.id==='district-search'){state.query=ev.target.value;const pos=ev.target.selectionStart;render();const input=document.getElementById('district-search');input.focus();input.setSelectionRange(pos,pos)}});
render();fetch(url,{cache:'force-cache'}).then(r=>r.ok?r.json():Promise.reject(new Error('map'))).then(d=>{if(d.features?.length!==254||new Set(d.features.map(f=>f.properties.id)).size!==254)throw Error('지도 경계 확인 실패');geo=d;render()}).catch(()=>{});
})();
</script></body></html>
